<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>DeFey Games — игры с душой</title>
    <meta name="description" content="DeFey Games создаёт уникальные игры с душой. Начните с коллекции исторических пасьянсов.">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <!-- Шапка с переключателем языков -->
    <div class="header">
        <div class="lang-selector">
            <div class="selected-lang" id="langSelected">
                <span id="currentLangFlag">🇬🇧</span> <span id="currentLangName">English</span> ▾
            </div>
            <ul class="lang-dropdown" id="langDropdown">
                <li data-lang="en" data-flag="🇬🇧">English</li>
                <li data-lang="ru" data-flag="🇷🇺">Русский</li>
                <!-- остальные 8 языков добавим позже -->
            </ul>
        </div>
        <div class="logo">
            🃟 DeFey Games
        </div>
        <div class="tagline" data-i18n="tagline">игры с душой • уникальные механики • в любое время</div>
    </div>

    <!-- Сюда будут загружаться карточки игр -->
    <div id="gamesContainer"></div>

    <footer>
        <p data-i18n="copyright">© 2026 DeFey Games. All rights reserved. jdefey@gmail.com</p>
    </footer>
</div>

<script src="script.js"></script>
</body>
</html>
